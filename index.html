<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SkyGlobe Pro</title>

<!-- FIX LINK -->
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
    margin:0;
    font-family:'Segoe UI';
    background:linear-gradient(#6ea6d8,#9fc2e6);
    color:white;
    overflow:hidden;
}

/* TOGGLE */
#toggle{
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    color:black;
    padding:10px;
    border-radius:50%;
    cursor:pointer;
    z-index:100;
}

/* SEARCH */
.top{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    z-index:20;
}

input{
    padding:10px;
    border-radius:20px;
    border:none;
    width:200px;
}

/* CLOCK */
.clock{
    position:absolute;
    top:70px;
    width:100%;
    text-align:center;
    font-size:45px;
}

/* PANEL */
.panel{
    position:absolute;
    bottom:0;
    width:100%;
    padding:20px;
}

/* GLASS CARD */
.card{
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:15px;
    margin-bottom:10px;
}

/* HOURLY */
.hourly{
    display:flex;
    overflow-x:auto;
    gap:15px;
}

.hour{
    text-align:center;
}

/* DAILY */
.daily{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.row{
    display:flex;
    justify-content:space-between;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}
</style>
</head>

<body>

<div id="toggle">🌙</div>

<div class="top">
<input id="search" placeholder="Cari kota..." onkeydown="if(event.key==='Enter')searchCity()">
</div>

<div class="clock" id="clock"></div>

<div class="panel">

<div class="card">
<h3>Next 24 Hours</h3>
<div id="hourly" class="hourly"></div>
</div>

<div class="card">
<h3>Next 7 Days</h3>
<div id="daily" class="daily"></div>
</div>

</div>

<script>

// CLOCK
setInterval(()=>{
let n=new Date();
document.getElementById("clock").innerText =
n.getHours()+":"+String(n.getMinutes()).padStart(2,"0");
},1000);

// ===== THREE NASA =====
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({alpha:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const sunLight = new THREE.DirectionalLight(0xffffff,1.5);
sunLight.position.set(5,3,5);
scene.add(sunLight);

scene.add(new THREE.AmbientLight(0xffffff,0.3));

// TEXTURE
const loader = new THREE.TextureLoader();

const earthTexture = loader.load(
"https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
);

const night = loader.load(
"https://threejs.org/examples/textures/planets/earth_lights_2048.png"
);

const cloud = loader.load(
"https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
);

// EARTH
const earth = new THREE.Mesh(
new THREE.SphereGeometry(1.3,128,128),
new THREE.MeshStandardMaterial({
    map:earthTexture,
    emissive:new THREE.Color(0xffffff),
    emissiveMap:night,
    emissiveIntensity:0.4
})
);
scene.add(earth);

// CLOUD
const clouds = new THREE.Mesh(
new THREE.SphereGeometry(1.32,128,128),
new THREE.MeshStandardMaterial({
    map:cloud,
    transparent:true,
    opacity:0.5
})
);
scene.add(clouds);

// SATELLITE
const sat = new THREE.Mesh(
new THREE.SphereGeometry(0.05),
new THREE.MeshBasicMaterial({color:0xffcc00})
);
scene.add(sat);

let angle=0;

// ANIMATE
function animate(){
requestAnimationFrame(animate);

earth.rotation.y+=0.001;
clouds.rotation.y+=0.0012;

angle+=0.02;

sat.position.set(
Math.cos(angle)*2,
Math.sin(angle)*0.5,
Math.sin(angle)*2
);

renderer.render(scene,camera);
}
animate();

// WEATHER
async function searchCity(){

let name=document.getElementById("search").value;

let geo = await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${name}`
).then(r=>r.json());

let c = geo.results[0];

// API
let w = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&hourly=temperature_2m&daily=temperature_2m_max,temperature_2m_min`
).then(r=>r.json());

// HOURLY
let h="";
for(let i=0;i<8;i++){
h+=`
<div class="hour">
${i}h<br>${Math.round(w.hourly.temperature_2m[i])}°
</div>`;
}
document.getElementById("hourly").innerHTML=h;

// DAILY
let d="";
for(let i=0;i<7;i++){
d+=`
<div class="row">
<div>Day ${i+1}</div>
<div>${Math.round(w.daily.temperature_2m_min[i])}° / ${Math.round(w.daily.temperature_2m_max[i])}°</div>
</div>`;
}
document.getElementById("daily").innerHTML=d;

}

// AUTO
navigator.geolocation.getCurrentPosition(()=>{
searchCity("Jakarta");
});

// DARK MODE
let dark=false;
document.getElementById("toggle").onclick=()=>{
dark=!dark;

if(dark){
document.body.style.background="#111";
document.getElementById("toggle").innerText="☀️";
}else{
document.body.style.background="linear-gradient(#6ea6d8,#9fc2e6)";
document.getElementById("toggle").innerText="🌙";
}
};

</script>
</body>
</html>
``
