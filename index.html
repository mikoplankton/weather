#ui {

    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.4);
    padding:15px;
    border-radius:15px;
    backdrop-filter: blur(10px);

#splash {
    position:fixed;
    top:0;
    left:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

}
