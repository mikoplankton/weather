<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Weather NASA Globe</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
    color:white;
}

/* UI */
#ui {
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    background:rgba(0,0,0,0.4);
    padding:15px;
    border-radius:15px;
    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

input {
    padding:8px;
    border:none;
    border-radius:10px;
}
button {
    padding:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>

</head>

<body>

<div id="ui">
    <input id="search" placeholder="Cari kota...">
    <button onclick="searchCity()">Search</button>

    <h2 id="clock"></h2>
    <h3 id="temp"></h3>
    <p id="city"></p>
</div>

<script>

// ===== SCENE =====
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75, innerWidth/innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.z = 3;

// ===== LIGHT =====
const light = new THREE.PointLight(0xffffff,1.5);
light.position.set(5,5,5);
scene.add(light);

// ===== TEXTURES =====
const loader = new THREE.TextureLoader();

const earthTexture = loader.load(
"https://threejs.org/examples/textures/earth_atmos_2048.jpg"
);

const nightTexture = loader.load(
"https://threejs.org/examples/textures/earth_lights_2048.png"
);

const cloudTexture = loader.load(
"https://threejs.org/examples/textures/earth_clouds_1024.png"
);

// ===== EARTH =====
const earthMaterial = new THREE.MeshStandardMaterial({
    map: earthTexture,
    emissive: new THREE.Color(0xffffff),
    emissiveMap: nightTexture,
    emissiveIntensity: 0.6
});

const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1,64,64),
    earthMaterial
);

scene.add(earth);

// ===== CLOUD =====
const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(1.01,64,64),
    new THREE.MeshStandardMaterial({
        map: cloudTexture,
        transparent:true,
        opacity:0.5
    })
);
scene.add(clouds);

// ===== MARKER =====
const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.03,16,16),
    new THREE.MeshBasicMaterial({color:0xff0000})
);
scene.add(marker);

// ===== DRAG ROTATE =====
let isDragging=false;
let prevX=0;

window.addEventListener("mousedown", e=>{
    isDragging=true;
    prevX=e.clientX;
});

window.addEventListener("mouseup", ()=> isDragging=false);

window.addEventListener("mousemove", e=>{
    if(isDragging){
        let dx=e.clientX-prevX;
        earth.rotation.y += dx * 0.005;
        clouds.rotation.y += dx * 0.005;
        prevX=e.clientX;
    }
});

// ===== TOUCH MOBILE =====
window.addEventListener("touchstart", e=>{
    isDragging=true;
    prevX=e.touches[0].clientX;
});

window.addEventListener("touchend", ()=> isDragging=false);

window.addEventListener("touchmove", e=>{
    if(isDragging){
        let dx=e.touches[0].clientX-prevX;
        earth.rotation.y += dx * 0.005;
        clouds.rotation.y += dx * 0.005;
        prevX=e.touches[0].clientX;
    }
});

// ===== ZOOM =====
window.addEventListener("wheel", e=>{
    camera.position.z += e.deltaY * 0.001;
    camera.position.z = Math.max(1.5, Math.min(5, camera.position.z));
});

// ===== ANIMATE =====
function animate(){
    requestAnimationFrame(animate);

    earth.rotation.y += 0.001;
    clouds.rotation.y += 0.0012;

    renderer.render(scene,camera);
}
animate();

// ===== CLOCK =====
let currentTZ = "Asia/Jakarta";

setInterval(()=>{
    let local = new Date().toLocaleString("en-US",{timeZone:currentTZ});
    let d = new Date(local);

    document.getElementById("clock").innerText =
    d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");

},1000);

// ===== SEARCH =====
async function searchCity(){

    let name=document.getElementById("search").value;

    let geo=await fetch(
    `https://geocoding-api.open-meteo.com/v1/search?name=${name}`
    ).then(r=>r.json());

    let c=geo.results[0];

    document.getElementById("city").innerText =
    c.name + ", " + c.country_code;

    currentTZ = c.timezone;

    // WEATHER
    let w = await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m`
    ).then(r=>r.json());

    document.getElementById("temp").innerText =
    Math.round(w.current.temperature_2m)+"°C";

    // ===== MARKER =====
    let lat = c.latitude * (Math.PI/180);
    let lon = c.longitude * (Math.PI/180);

    marker.position.set(
        Math.cos(lat)*Math.sin(lon),
        Math.sin(lat),
        Math.cos(lat)*Math.cos(lon)
    );

    // focus rotation
    earth.rotation.y = lon;
}

// ===== SW =====
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
