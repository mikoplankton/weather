<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SkyGlobe Weather</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI';
background:linear-gradient(#6ea6d8,#9fc2e6);
color:white;
overflow:hidden;
}

/* SEARCH */
.top{
position:absolute;
top:10px;
width:100%;
text-align:center;
z-index:10;
}

input{
padding:10px;
border-radius:20px;
border:none;
}

/* TOGGLE */
#toggle{
position:absolute;
top:10px;
right:10px;
background:white;
color:black;
padding:10px;
border-radius:50%;
cursor:pointer;
z-index:10;
}

/* HEADER */
.header{
margin-top:70px;
text-align:center;
z-index:10;
position:relative;
}

.big{
font-size:70px;
}

/* PANEL */
.panel{
position:absolute;
bottom:0;
width:100%;
padding:15px;
z-index:10;
}

/* CARD */
.card{
background:rgba(255,255,255,0.2);
backdrop-filter:blur(20px);
border-radius:20px;
padding:15px;
margin-bottom:10px;
}

/* HOURLY */
.hourly{
display:flex;
overflow-x:auto;
gap:15px;
}

.hour{
min-width:80px;
text-align:center;
}

/* DAILY */
.row{
display:flex;
justify-content:space-between;
margin:10px 0;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

/* GLOBE */
canvas{
position:absolute;
top:0;
left:0;
z-index:0;
}
</style>
</head>

<body>

<div id="toggle">🌙</div>

<div class="top">
<input id="search" placeholder="Cari kota..." onkeydown="if(event.key==='Enter')loadWeather()">
</div>

<div class="header">
<div id="city">Loading...</div>
<div id="temp" class="big">--°</div>
<div id="desc"></div>
</div>

<div class="panel">

<div class="card" id="info"></div>

<div class="card">
<h3>Next 24 Hours</h3>
<div class="hourly" id="hourly"></div>
</div>

<div class="card">
<h3>Next 7 Days</h3>
<div id="daily"></div>
</div>

<div class="grid">
<div class="card" id="rain"></div>
<div class="card" id="wind"></div>
<div class="card" id="air"></div>
<div class="card" id="uv"></div>
<div class="card" id="hum"></div>
<div class="card" id="sun"></div>
</div>

</div>

<script>

// ===== WEATHER DESC =====
function getDesc(code){
if(code==0) return "Clear";
if(code<=3) return "Cloudy";
if(code<=67) return "Rain";
return "Storm";
}

// ===== LOAD WEATHER =====
async function loadWeather(){

let cityName=document.getElementById("search").value || "Jakarta";

let geo = await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${cityName}`
).then(r=>r.json());

let c = geo.results[0];

let w = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}
&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weathercode
&hourly=temperature_2m,time
&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset`
).then(r=>r.json());

let cur=w.current;

// HEADER
document.getElementById("city").innerText=c.name;
document.getElementById("temp").innerText=Math.round(cur.temperature_2m)+"°";
document.getElementById("desc").innerText=getDesc(cur.weathercode);

// INFO
document.getElementById("info").innerText =
`Humidity ${cur.relative_humidity_2m}% - Weather feels comfortable today`;

// HOURLY
let h="";
for(let i=0;i<8;i++){
let hour=new Date(w.hourly.time[i]).getHours();
h+=`<div class="hour">${hour}:00<br>${Math.round(w.hourly.temperature_2m[i])}°</div>`;
}
document.getElementById("hourly").innerHTML=h;

// DAILY
let d="";
for(let i=0;i<7;i++){
d+=`<div class="row">
<div>Day ${i+1}</div>
<div>${Math.round(w.daily.temperature_2m_min[i])}° / ${Math.round(w.daily.temperature_2m_max[i])}°</div>
</div>`;
}
document.getElementById("daily").innerHTML=d;

// EXTRA
document.getElementById("rain").innerText="No rain";
document.getElementById("wind").innerText=cur.wind_speed_10m+" km/h";
document.getElementById("air").innerText="Air quality good";
document.getElementById("uv").innerText="UV Low";
document.getElementById("hum").innerText=cur.relative_humidity_2m+"%";
document.getElementById("sun").innerHTML=
"Sunrise "+w.daily.sunrise[0].split("T")[1]+"<br>Sunset "+w.daily.sunset[0].split("T")[1];

}

loadWeather();

// ===== GLOBE =====
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,1,4);

const renderer=new THREE.WebGLRenderer({alpha:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const earth=new THREE.Mesh(
new THREE.SphereGeometry(0.8,128,128),
new THREE.MeshStandardMaterial({
map:new THREE.TextureLoader().load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg")
})
);

scene.add(earth);
scene.add(new THREE.AmbientLight(0xffffff,1));

function animate(){
requestAnimationFrame(animate);
earth.rotation.y+=0.001;
renderer.render(scene,camera);
}
animate();

// ===== DARK MODE =====
document.getElementById("toggle").onclick=()=>{
document.body.style.background =
document.body.style.background.includes("#111")
?"linear-gradient(#6ea6d8,#9fc2e6)"
:"#111";
};

</script>

</body>
</html>
