<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SkyGlobe Weather PRO</title>

<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
    margin:0;
    font-family:'Segoe UI';
    background:linear-gradient(#6ea6d8,#9fc2e6);
    color:white;
    overflow:hidden;
}

/* SEARCH */
.top{
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
}

/* HEADER */
.header{
    margin-top:60px;
    text-align:center;
}

.big{
    font-size:60px;
}

.desc{
    font-size:20px;
    opacity:0.8;
}

/* PANEL */
.panel{
    position:absolute;
    bottom:0;
    width:100%;
    padding:20px;
}

/* CARD */
.card{
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:15px;
    margin-bottom:10px;
}

/* HOURLY */
.hourly{
    display:flex;
    overflow-x:auto;
}
.hour{
    min-width:60px;
    text-align:center;
}

/* DAILY */
.row{
    display:flex;
    justify-content:space-between;
}
canvas{
    position:absolute;
    top:0;
    left:0;
}
</style>
</head>

<body>

<div class="top">
<input id="search" placeholder="Cari kota..." 
onkeydown="if(event.key==='Enter')searchCity()">
</div>

<div class="header">
<div id="city"></div>
<div id="temp" class="big"></div>
<div id="desc" class="desc"></div>

<div>
💧 <span id="hum"></span>%  
🌬️ <span id="wind"></span> km/h
</div>
</div>

<div class="panel">

<div class="card">
<h3>Next 24 Hours</h3>
<div id="hourly" class="hourly"></div>
</div>

<div class="card">
<h3>Next 7 Days</h3>
<div id="daily"></div>
</div>

</div>

<script>

// ===== WEATHER CODE → TEXT =====
function getWeatherDesc(code){
if(code==0) return "Clear";
if(code<=3) return "Cloudy";
if(code<=48) return "Fog";
if(code<=67) return "Rain";
if(code<=77) return "Snow";
return "Storm";
}

// ===== WEATHER =====
async function searchCity(){

let name=document.getElementById("search").value;

let geo=await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${name}`
).then(r=>r.json());

let c=geo.results[0];

document.getElementById("city").innerText = c.name;

// ===== GET DATA =====
let w=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}
&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weathercode
&hourly=temperature_2m,weathercode
&daily=temperature_2m_max,temperature_2m_min,weathercode`
).then(r=>r.json());

let cur=w.current;

// ==== CURRENT ====
document.getElementById("temp").innerText =
Math.round(cur.temperature_2m)+"°C";

document.getElementById("hum").innerText = cur.relative_humidity_2m;
document.getElementById("wind").innerText = cur.wind_speed_10m;

document.getElementById("desc").innerText =
getWeatherDesc(cur.weathercode);

// ==== HOURLY ====
let h="";
for(let i=0;i<10;i++){
h+=`
<div class="hour">
${i}:00<br>
${Math.round(w.hourly.temperature_2m[i])}°
</div>`;
}
document.getElementById("hourly").innerHTML=h;

// ==== DAILY ====
let d="";
for(let i=0;i<7;i++){
d+=`
<div class="row">
<div>Day ${i+1}</div>
<div>
${Math.round(w.daily.temperature_2m_min[i])}° /
${Math.round(w.daily.temperature_2m_max[i])}°
</div>
</div>`;
}
document.getElementById("daily").innerHTML=d;

}

// auto load
navigator.geolocation.getCurrentPosition(()=>{
searchCity("Jakarta");
});

</script>
</body>
</html>
``
