<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SkyGlobe Weather Ultimate FIX</title>

<!-- ✅ FIX YANG BENAR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(#6ea6d8,#9fc2e6);
color:white;
overflow-x:hidden;
transition:0.5s;
}

.app{
height:100vh;
overflow-y:auto;
}

/* SEARCH */
.search{
position:fixed;
top:10px;
width:100%;
text-align:center;
z-index:10;
}

input{
padding:10px;
border-radius:20px;
border:none;
}

/* TOGGLE */
#toggle{
position:fixed;
top:10px;
right:10px;
background:white;
color:black;
padding:10px;
border-radius:50%;
cursor:pointer;
}

/* HEADER */
.header{
margin-top:80px;
text-align:center;
}

.temp{
font-size:70px;
}

/* CARD */
.card{
margin:15px;
padding:15px;
border-radius:20px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(20px);
}

/* HOURLY */
.hourly{
display:flex;
gap:10px;
overflow-x:auto;
}

.row{
display:flex;
justify-content:space-between;
}

/* GLOBE */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
opacity:0.25;
}
</style>
</head>

<body>

<div id="toggle">🌙</div>

<div class="search">
<input id="search" placeholder="Cari kota..." onkeydown="if(event.key==='Enter')loadWeather()">
</div>

<div class="app">

<div class="header">
<div id="city">Loading...</div>
<div id="temp" class="temp">--°</div>
<div id="desc">--</div>
</div>

<div class="card" id="info"></div>

<div class="card">
<h3>Next 24 Hours</h3>
<div id="hourly" class="hourly"></div>
</div>

<div class="card">
<h3>Next 7 Days</h3>
<div id="daily"></div>
</div>

</div>

<script>

// ✅ DOM SAFE
const cityEl = document.getElementById("city");
const tempEl = document.getElementById("temp");
const descEl = document.getElementById("desc");
const infoEl = document.getElementById("info");
const hourlyEl = document.getElementById("hourly");
const dailyEl = document.getElementById("daily");
const toggleBtn = document.getElementById("toggle");

// ✅ DARK MODE
let dark=false;
toggleBtn.onclick=()=>{
dark=!dark;
document.body.style.background =
dark ? "#111" : "linear-gradient(#6ea6d8,#9fc2e6)";
};

// ✅ WEATHER SAFE
async function loadWeather(){

let name = document.getElementById("search").value || "Jakarta";

try{

let geoRes = await fetch(
"https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(name)
);
let geo = await geoRes.json();

if(!geo.results){
throw "No city";
}

let c = geo.results[0];

let wRes = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m,relative_humidity_2m&hourly=temperature_2m,time&daily=temperature_2m_max,temperature_2m_min`
);

let w = await wRes.json();

// UI
cityEl.innerText=c.name;
tempEl.innerText=Math.round(w.current.temperature_2m)+"°";
descEl.innerText="Weather OK";

infoEl.innerText="Humidity "+w.current.relative_humidity_2m+"%";

// hourly
hourlyEl.innerHTML="";
for(let i=0;i<8;i++){
let h=new Date(w.hourly.time[i]).getHours();
hourlyEl.innerHTML+=`<div>${h}:00<br>${Math.round(w.hourly.temperature_2m[i])}°</div>`;
}

// daily
dailyEl.innerHTML="";
for(let i=0;i<7;i++){
dailyEl.innerHTML+=`
<div class="row">
<div>Day ${i+1}</div>
<div>${Math.round(w.daily.temperature_2m_min[i])}° / ${Math.round(w.daily.temperature_2m_max[i])}°</div>
</div>`;
}

}catch(e){
console.log(e);

// fallback
cityEl.innerText="Jakarta";
tempEl.innerText="30°";
descEl.innerText="Fallback mode";
infoEl.innerText="Data default";
hourlyEl.innerHTML="<div>Fallback</div>";
dailyEl.innerHTML="<div>Fallback</div>";
}
}

loadWeather();

// ✅ GLOBE REAL FIX
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75, window.innerWidth/window.innerHeight, 0.1, 1000
);
camera.position.z=4;

const renderer = new THREE.WebGLRenderer({alpha:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

const globe = new THREE.Mesh(
new THREE.SphereGeometry(0.8,64,64),
new THREE.MeshStandardMaterial({
map:new THREE.TextureLoader().load(
"https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
)
})
);

scene.add(globe);
scene.add(new THREE.AmbientLight(0xffffff,1));

function animate(){
requestAnimationFrame(animate);
globe.rotation.y+=0.001;
renderer.render(scene,camera);
}
animate();

</script>

</body>
</html>
