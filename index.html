<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Weather Globe Pro</title>

manifest.json

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
    background:black;
    color:white;
}

/* UI */
#ui {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:320px;
    text-align:center;

    background:rgba(0,0,0,0.3);
    padding:20px;
    border-radius:20px;

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:
        0 0 40px rgba(255,255,255,0.1),
        0 20px 80px rgba(0,0,0,0.8);

    opacity:0;
    transition:1s;
}

#ui.show {
    opacity:1;
}

#clock { font-size:40px; margin:10px; }

input {
    width:70%;
    padding:10px;
    border:none;
    border-radius:12px;
}

button {
    padding:10px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}
</style>

</head>

<body>

<div id="ui">
<input id="search" placeholder="Cari kota...">
<button onclick="searchCity()">Search</button>

<h2 id="clock"></h2>
<h3 id="temp"></h3>
<p id="city"></p>
</div>

<script>

// ===== INIT UI FADE =====
setTimeout(() => {
    document.getElementById("ui").classList.add("show");
}, 800);

// ===== SCENE =====
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75, innerWidth/innerHeight, 0.1, 1000
);

camera.position.set(0,0,3);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

// ===== LIGHT =====
const light = new THREE.PointLight(0xffffff,2);
light.position.set(5,5,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff,1);
scene.add(ambient);

// ===== TEXTURE =====
const loader = new THREE.TextureLoader();

const earthTexture = loader.load(
"https://threejs.org/examples/textures/earth_atmos_2048.jpg"
);

const nightTexture = loader.load(
"https://threejs.org/examples/textures/earth_lights_2048.png"
);

const cloudTexture = loader.load(
"https://threejs.org/examples/textures/earth_clouds_1024.png"
);

// ===== EARTH =====
const earth = new THREE.Mesh(
new THREE.SphereGeometry(1.3,64,64),
new THREE.MeshStandardMaterial({
    map: earthTexture,
    emissive: new THREE.Color(0xffffff),
    emissiveMap: nightTexture,
    emissiveIntensity: 0.3
})
);

scene.add(earth);

// ===== CLOUD =====
const clouds = new THREE.Mesh(
new THREE.SphereGeometry(1.32,64,64),
new THREE.MeshStandardMaterial({
    map: cloudTexture,
    transparent:true,
    opacity:0.5
})
);

scene.add(clouds);

// ===== MARKER (PULSE) =====
const marker = new THREE.Mesh(
new THREE.SphereGeometry(0.06,16,16),
new THREE.MeshBasicMaterial({color:0xff0000})
);

scene.add(marker);

// pulse animation
setInterval(()=>{
    marker.scale.set(1.5,1.5,1.5);
    setTimeout(()=> marker.scale.set(1,1,1),200);
},1000);

// ===== CAMERA ORBIT =====
let angle = 0;

// ===== ANIMATE =====
function animate(){
    requestAnimationFrame(animate);

    angle += 0.002;

    // CINEMATIC ORBIT
    camera.position.x = Math.sin(angle)*3;
    camera.position.z = Math.cos(angle)*3;
    camera.lookAt(0,0,0);

    earth.rotation.y += 0.001;
    clouds.rotation.y += 0.0012;

    renderer.render(scene,camera);
}

animate();

// ===== CLOCK =====
let currentTZ="Asia/Jakarta";

setInterval(()=>{
let local = new Date().toLocaleString("en-US",{timeZone:currentTZ});
let d = new Date(local);

document.getElementById("clock").innerText =
d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");

},1000);

// ===== SMOOTH ROTATION =====
function smoothRotate(target){
    let start = earth.rotation.y;
    let diff = target - start;

    let t = 0;

    function step(){
        t += 0.02;
        earth.rotation.y = start + diff*t;
        if(t < 1) requestAnimationFrame(step);
    }

    step();
}

// ===== SEARCH =====
async function searchCity(){

let name=document.getElementById("search").value.trim();
if(!name) return;

let geo = await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${name}`
).then(r=>r.json());

let c = geo.results.find(x => x.country_code==="ID") || geo.results[0];

document.getElementById("city").innerText =
c.name + ", " + c.country_code;

currentTZ = c.timezone;

// WEATHER
let w = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m`
).then(r=>r.json());

document.getElementById("temp").innerText =
Math.round(w.current.temperature_2m)+"°C";

// POSITION
let lat = (90 - c.latitude) * Math.PI/180;
let lon = (c.longitude + 180) * Math.PI/180;

marker.position.set(
Math.sin(lat)*Math.cos(lon),
Math.cos(lat),
Math.sin(lat)*Math.sin(lon)
);

// 🎬 SMOOTH ROTATE
smoothRotate(lon);

}

// ===== SERVICE WORKER =====
if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
