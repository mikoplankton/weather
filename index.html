<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Weather Globe Ultimate</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
    margin:0;
    overflow:hidden;
    color:white;
    font-family:sans-serif;
}

#ui {
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    background:rgba(0,0,0,0.4);
    padding:15px;
    border-radius:15px;
}

input {
    padding:8px;
    border:none;
    border-radius:10px;
}
button {
    padding:8px;
    border:none;
    border-radius:10px;
}
</style>

</head>

<body>

<div id="ui">
    <input id="search" placeholder="Cari kota...">
    <button onclick="searchCity()">Search</button>

    <h2 id="clock"></h2>
    <h3 id="temp"></h3>
    <p id="city"></p>
</div>

<script>

// ===== THREE GLOBE =====
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75, innerWidth/innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.z = 3;

// LIGHT
const light = new THREE.PointLight(0xffffff,1.5);
light.position.set(5,5,5);
scene.add(light);

// EARTH
const texture = new THREE.TextureLoader().load(
"https://threejs.org/examples/textures/earth_atmos_2048.jpg"
);

const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1,64,64),
    new THREE.MeshStandardMaterial({map:texture})
);

scene.add(earth);

// ANIMATE
function animate(){
    requestAnimationFrame(animate);
    earth.rotation.y += 0.002;
    renderer.render(scene,camera);
}
animate();

// ===== CLOCK (TIMEZONE) =====
let currentTZ = "Asia/Jakarta";

function runClock(){
    setInterval(()=>{
        let now = new Date().toLocaleString("en-US",{timeZone:currentTZ});
        let d = new Date(now);

        document.getElementById("clock").innerText =
        d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");

    },1000);
}
runClock();

// ===== WEATHER + SEARCH =====
async function searchCity(){

    let name = document.getElementById("search").value;

    let geo = await fetch(
    `https://geocoding-api.open-meteo.com/v1/search?name=${name}`
    ).then(r=>r.json());

    if(!geo.results){
        alert("Kota tidak ditemukan");
        return;
    }

    let c = geo.results[0];

    currentTZ = c.timezone;

    document.getElementById("city").innerText =
    c.name + " (" + c.country_code + ")";

    // WEATHER API
    let w = await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m`
    ).then(r=>r.json());

    let t = w.current.temperature_2m;

    document.getElementById("temp").innerText = t+"°C";

    // ROTATE GLOBE
    let targetLon = (c.longitude / 180) * Math.PI;
    earth.rotation.y = targetLon;

}

// GPS AUTO
navigator.geolocation.getCurrentPosition(pos=>{
    searchCity("Jakarta");
});

// SW
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
