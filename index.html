<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SkyGlobe Weather</title>

<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
background:linear-gradient(#6ea6d8,#9fc2e6);
color:white;
overflow-x:hidden;
}

/* SEARCH */
.search{
position:fixed;
top:15px;
width:100%;
text-align:center;
z-index:20;
}

.search input{
padding:10px 15px;
border-radius:25px;
border:none;
width:200px;
}

/* TOGGLE */
#toggle{
position:fixed;
top:15px;
right:15px;
background:white;
color:black;
padding:10px;
border-radius:50%;
z-index:20;
cursor:pointer;
}

/* HEADER */
.header{
margin-top:80px;
text-align:center;
position:relative;
z-index:10;
}

.temp{
font-size:90px;
font-weight:200;
}

.desc{
font-size:22px;
opacity:0.9;
}

.sub{
opacity:0.7;
}

/* PANEL */
.container{
padding:20px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.18);
backdrop-filter:blur(25px);
border-radius:25px;
padding:20px;
margin-bottom:15px;
}

/* HOURLY */
.hourly{
display:flex;
overflow-x:auto;
gap:15px;
margin-top:10px;
}

.hour{
min-width:70px;
text-align:center;
font-size:14px;
}

/* DAILY */
.daily .row{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,0.2);
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

/* GLOBE */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
opacity:0.35;
}
</style>
</head>

<body>

<!-- SEARCH -->
<div class="search">
<input id="search" placeholder="Cari kota..." onkeydown="if(event.key==='Enter')loadWeather()">
</div>

<!-- TOGGLE -->
<div id="toggle">🌙</div>

<!-- HEADER -->
<div class="header">
<div id="city">Jakarta</div>
<div class="temp" id="temp">--°</div>
<div class="desc" id="desc">--</div>
<div class="sub" id="range">-- / --</div>
</div>

<!-- CONTENT -->
<div class="container">

<!-- INFO -->
<div class="card" id="info"></div>

<!-- HOURLY -->
<div class="card">
<h3>Next 24 Hours</h3>
<div class="hourly" id="hourly"></div>
</div>

<!-- DAILY -->
<div class="card">
<h3>Next 8 Days</h3>
<div class="daily" id="daily"></div>
</div>

<!-- GRID -->
<div class="grid">
<div class="card" id="rain"></div>
<div class="card" id="wind"></div>
<div class="card" id="air"></div>
<div class="card" id="uv"></div>
<div class="card" id="hum"></div>
<div class="card" id="sun"></div>
</div>

</div>

<script>

// ICON MAPPING
function icon(code){
if(code==0)return"☀️";
if(code<=3)return"☁️";
if(code<=67)return"🌧️";
return"⛈️";
}

// LOAD WEATHER
async function loadWeather(){

let name = document.getElementById("search").value || "Jakarta";

let geo = await fetch(
"https://geocoding-api.open-meteo.com/v1/search?name="+name
).then(r=>r.json());

let c = geo.results[0];

let w = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}
&current=temperature_2m,weathercode,relative_humidity_2m,wind_speed_10m
&hourly=temperature_2m,time,weathercode
&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset`
).then(r=>r.json());

// HEADER
city.innerText=c.name;
temp.innerText=Math.round(w.current.temperature_2m)+"°";
desc.innerText=icon(w.current.weathercode)+" Cloudy";

range.innerText =
Math.round(w.daily.temperature_2m_min[0])+" / "+
Math.round(w.daily.temperature_2m_max[0]);

// INFO TEXT
info.innerText =
`The humidity is ${w.current.relative_humidity_2m}%. The weather feels comfortable.`;

// HOURLY
hourly.innerHTML="";
for(let i=0;i<12;i++){
let h = new Date(w.hourly.time[i]).getHours();
hourly.innerHTML+=`
<div class="hour">
${i==0?"Now":h+":00"}<br>
${icon(w.hourly.weathercode[i])}<br>
${Math.round(w.hourly.temperature_2m[i])}°
</div>`;
}

// DAILY
daily.innerHTML="";
for(let i=0;i<7;i++){
daily.innerHTML+=`
<div class="row">
<div>Day ${i+1}</div>
<div>${icon(w.hourly.weathercode[i])}</div>
<div>${Math.round(w.daily.temperature_2m_min[i])}° / ${Math.round(w.daily.temperature_2m_max[i])}°</div>
</div>`;
}

// EXTRA
rain.innerHTML="Precipitation<br>0 mm";
wind.innerHTML="Wind<br>"+w.current.wind_speed_10m+" km/h";
air.innerHTML="Air Quality<br>42";
uv.innerHTML="UV<br>2";
hum.innerHTML="Humidity<br>"+w.current.relative_humidity_2m+"%";
sun.innerHTML="Sun<br>"+w.daily.sunrise[0].split("T")[1]+" / "+w.daily.sunset[0].split("T")[1];

}

loadWeather();

// ===== GLOBE =====
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z=4;

const renderer=new THREE.WebGLRenderer({alpha:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const globe=new THREE.Mesh(
new THREE.SphereGeometry(1.2,128,128),
new THREE.MeshStandardMaterial({
map:new THREE.TextureLoader().load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg")
})
);

scene.add(globe);
scene.add(new THREE.AmbientLight(0xffffff,1));

function animate(){
requestAnimationFrame(animate);
globe.rotation.y+=0.001;
renderer.render(scene,camera);
}
animate();

// DARK MODE
toggle.onclick=()=>{
document.body.style.background =
document.body.style.background.includes("#111")
?"linear-gradient(#6ea6d8,#9fc2e6)"
:"#111";
};

</script>
</body>
</html>
