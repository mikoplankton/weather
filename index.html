<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SkyGlobe Weather</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
    margin:0;
    font-family:'Segoe UI';
    background:linear-gradient(#6ea6d8,#9fc2e6);
    color:white;
    overflow-x:hidden;
    transition:0.5s;
}

/* SCROLL */
.app{
    height:100vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

/* HIDE SCROLL */
.app::-webkit-scrollbar{
    display:none;
}

/* SEARCH */
.search{
    position:fixed;
    top:10px;
    width:100%;
    text-align:center;
}

input{
    padding:10px;
    border-radius:20px;
    border:none;
}

/* TOGGLE */
#toggle{
    position:fixed;
    top:10px;
    right:10px;
    background:white;
    color:black;
    padding:10px;
    border-radius:50%;
    cursor:pointer;
}

/* HEADER */
.header{
    margin-top:80px;
    text-align:center;
}

.temp{
    font-size:80px;
}

/* CARD */
.card{
    margin:15px;
    padding:15px;
    border-radius:20px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(20px);
}

/* HOURLY */
.hourly{
    display:flex;
    gap:15px;
    overflow-x:auto;
}

.hour{
    min-width:60px;
    text-align:center;
}

/* DAILY */
.row{
    display:flex;
    justify-content:space-between;
}

/* GLOBE */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
    opacity:0.25;
}
</style>
</head>

<body>

<div id="toggle">🌙</div>

<div class="search">
<input id="search" placeholder="Cari kota..." onkeydown="if(event.key==='Enter')loadWeather()">
</div>

<div class="app" id="app">

<div class="header">
<div id="city">Loading...</div>
<div class="temp" id="temp">--°</div>
<div id="desc"></div>
</div>

<div class="card" id="info"></div>

<div class="card">
<h3>Next 24 Hours</h3>
<div class="hourly" id="hourly"></div>
</div>

<div class="card">
<h3>Next 7 Days</h3>
<div id="daily"></div>
</div>

</div>

<script>

// DARK MODE FIX
let dark=false;
toggle.onclick=()=>{
    dark=!dark;
    document.body.style.background=
        dark?"#111":"linear-gradient(#6ea6d8,#9fc2e6)";
    toggle.innerText=dark?"☀️":"🌙";
};

// WEATHER SAFE
async function loadWeather(){

let name=document.getElementById("search").value || "Jakarta";

try{
let geo=await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${name}`
).then(r=>r.json());

if(!geo.results){
city.innerText="Tidak ditemukan";
return;
}

let c=geo.results[0];

let w=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}
&current=temperature_2m,relative_humidity_2m
&hourly=temperature_2m,time
&daily=temperature_2m_max,temperature_2m_min`
).then(r=>r.json());

// HEADER
city.innerText=c.name;
temp.innerText=Math.round(w.current.temperature_2m)+"°";
desc.innerText="Weather";

// INFO
info.innerText="Humidity "+w.current.relative_humidity_2m+"%";

// HOURLY
hourly.innerHTML="";
for(let i=0;i<8;i++){
let h=new Date(w.hourly.time[i]).getHours();
hourly.innerHTML+=
`<div class="hour">${h}:00<br>${Math.round(w.hourly.temperature_2m[i])}°</div>`;
}

// DAILY
daily.innerHTML="";
for(let i=0;i<7;i++){
daily.innerHTML+=`
<div class="row">
<div>Day ${i+1}</div>
<div>${Math.round(w.daily.temperature_2m_min[i])}° /
${Math.round(w.daily.temperature_2m_max[i])}°</div>
</div>`;
}

}catch(e){
city.innerText="Error data";
}

}

loadWeather();

// ===== GLOBE =====
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,1,4);

const renderer=new THREE.WebGLRenderer({alpha:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const globe=new THREE.Mesh(
new THREE.SphereGeometry(0.8,128,128),
new THREE.MeshStandardMaterial({
map:new THREE.TextureLoader().load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg")
})
);

scene.add(globe);
scene.add(new THREE.AmbientLight(0xffffff,1));

function animate(){
requestAnimationFrame(animate);
globe.rotation.y+=0.001;
renderer.render(scene,camera);
}
animate();

</script>

</body>
</html>
