<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Weather Cinematic</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000">

<style>

body{
    margin:0;
    font-family:sans-serif;
    overflow:hidden;
    transition:1s;
}

/* THEMES */
.sunny { background:linear-gradient(#4facfe,#00f2fe); }
.rainy { background:linear-gradient(#2c3e50,#4ca1af); }
.cloudy { background:linear-gradient(#bdc3c7,#2c3e50); }

/* CANVAS */
canvas{
    position:fixed;
    top:0; left:0;
}

/* UI CINEMATIC */
.ui{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;

    color:white;
    z-index:10;

    backdrop-filter:blur(10px);
    background:rgba(0,0,0,0.3);
    padding:25px;
    border-radius:20px;

    box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

.clock{
    font-size:80px;
}
.temp{
    font-size:40px;
}

/* CARD */
.card{
    margin-top:10px;
}

</style>

</head>

<body class="sunny">

<canvas id="rain"></canvas>

<div class="ui">
<div class="clock" id="clock"></div>
<div class="temp" id="temp"></div>

<div class="card">💧 <span id="hum"></span></div>
<div class="card">🌬️ <span id="wind"></span></div>
<div class="card">☀️ <span id="uv"></span></div>
</div>

<script>

// ===== CLOCK =====
setInterval(()=>{
let now = new Date();
document.getElementById("clock").innerText =
now.getHours()+":"+String(now.getMinutes()).padStart(2,'0');
},1000);

// ===== CANVAS BALANCE =====
const canvas=document.getElementById("rain");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let rain=[];
let isRaining=false;

// create rain
for(let i=0;i<150;i++){
    rain.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        l:Math.random()*10
    });
}

// ===== BATTERY SAVER =====
let fps = 60;
let lastFrame = 0;

function drawRain(time){
    if(!isRaining) return;

    if(time - lastFrame < (1000/fps)) {
        requestAnimationFrame(drawRain);
        return;
    }
    lastFrame = time;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="rgba(255,255,255,0.5)";

    rain.forEach(p=>{
        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x,p.y+p.l);
        ctx.stroke();

        p.y+=8;
        if(p.y>canvas.height) p.y=0;
    });

    requestAnimationFrame(drawRain);
}

// ===== SOUND =====
let rainSound=new Audio("https://www.soundjay.com/nature/rain-01.mp3");
rainSound.loop=true;

let windSound=new Audio("https://www.soundjay.com/nature/wind-01.mp3");
windSound.loop=true;

// unlock audio mobile
document.addEventListener("click", ()=>{
    rainSound.play().catch(()=>{});
    windSound.play().catch(()=>{});
});

// ===== LIGHTNING =====
function lightning(){
    document.body.style.filter="brightness(2)";
    setTimeout(()=>{
        document.body.style.filter="brightness(1)";
    },150);
}

// random lightning
setInterval(()=>{
    if(isRaining && Math.random()>0.7){
        lightning();
    }
},3000);

// ===== WEATHER =====
async function getWeather(lat,lon){

let data = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,uv_index`
).then(r=>r.json());

let c = data.current;

document.getElementById("temp").innerText =
Math.round(c.temperature_2m)+"°C";

document.getElementById("hum").innerText = c.relative_humidity_2m+"%";
document.getElementById("wind").innerText = c.wind_speed_10m;
document.getElementById("uv").innerText = c.uv_index;

// ===== MODE CONTROL =====
if(c.temperature_2m > 30){
    document.body.className="sunny";
    isRaining=false;
    fps = 30;
    rainSound.pause();
    windSound.pause();
}
else if(c.temperature_2m < 25){
    document.body.className="rainy";
    isRaining=true;
    fps = 60;
    drawRain();
    rainSound.play();
    windSound.play();
}
else{
    document.body.className="cloudy";
    isRaining=false;
    fps = 30;
    rainSound.pause();
    windSound.play();
}

}

// GPS
navigator.geolocation.getCurrentPosition(pos=>{
    getWeather(pos.coords.latitude,pos.coords.longitude);
});

// SW
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
