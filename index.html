<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Weather Globe Stable</title>

<link rel="manifest" href="manifest.json">

<!-- FIX THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
    color:white;
}

/* UI */
#ui {
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.5);
    padding:15px;
    border-radius:15px;
    text-align:center;
}

input {
    padding:8px;
    border:none;
    border-radius:10px;
}
button {
    padding:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>

</head>

<body>

<div id="ui">
    <input id="search" placeholder="Cari kota...">
    <button onclick="searchCity()">Search</button>

    <h2 id="clock"></h2>
    <h3 id="temp"></h3>
    <p id="city"></p>
</div>

<script>

// ===== THREE GLOBE =====
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75, window.innerWidth/window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.z = 3;

// LIGHT
const light = new THREE.PointLight(0xffffff,1.5);
light.position.set(5,5,5);
scene.add(light);

// EARTH TEXTURE
const loader = new THREE.TextureLoader();
const earthTexture = loader.load(
"https://threejs.org/examples/textures/earth_atmos_2048.jpg"
);

// EARTH
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1,64,64),
    new THREE.MeshStandardMaterial({map:earthTexture})
);

scene.add(earth);

// ANIMATION LOOP
function animate(){
    requestAnimationFrame(animate);
    earth.rotation.y += 0.002;
    renderer.render(scene,camera);
}
animate();

// ===== GLOBAL STATE =====
let currentTZ = "Asia/Jakarta";

// ===== CLOCK =====
function startClock(){
    setInterval(()=>{
        try{
            let local = new Date().toLocaleString("en-US",{ timeZone: currentTZ });
            let d = new Date(local);

            document.getElementById("clock").innerText =
                d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0");
        }catch{
            document.getElementById("clock").innerText = "--:--";
        }
    },1000);
}

startClock();

// ===== SEARCH CITY =====
async function searchCity(){

    let name = document.getElementById("search").value.trim();
    if(!name) return;

    try{
        // GEO
        let geo = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${name}&count=1`
        ).then(r=>r.json());

        if(!geo.results){
            alert("Kota tidak ditemukan");
            return;
        }

        let c = geo.results[0];

        // UPDATE UI
        document.getElementById("city").innerText =
            c.name + ", " + c.country_code;

        currentTZ = c.timezone;

        // WEATHER
        let w = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m`
        ).then(r=>r.json());

        document.getElementById("temp").innerText =
            Math.round(w.current.temperature_2m) + "°C";

        // ROTATE GLOBE
        let lon = c.longitude;
        earth.rotation.y = (lon / 180) * Math.PI;

    }catch(error){
        console.log(error);
        alert("Error ambil data");
    }
}

// ===== AUTO GPS FETCH =====
navigator.geolocation.getCurrentPosition(pos=>{
    getWeatherFromCoords(pos.coords.latitude, pos.coords.longitude);
});

// ===== GPS WEATHER =====
async function getWeatherFromCoords(lat, lon){

    let w = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`
    ).then(r=>r.json());

    document.getElementById("temp").innerText =
        Math.round(w.current.temperature_2m)+"°C";

    document.getElementById("city").innerText = "Lokasi Saya";
}

// ===== SW =====
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
``
