<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Ultimate++</title>

<link rel="manifest" href="manifest.json">

<style>

body{
    margin:0;
    font-family:sans-serif;
    overflow:hidden;
    transition:1s;
}

/* THEMES */
.sunny { background:linear-gradient(#4facfe,#00f2fe); }
.rainy { background:linear-gradient(#2c3e50,#4ca1af); }
.cloudy { background:linear-gradient(#bdc3c7,#2c3e50); }

/* CANVAS */
canvas{
    position:fixed;
    top:0;
    left:0;
}

/* UI */
.ui{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    z-index:10;
}

.clock{
    font-size:80px;
}

.card{
    background:rgba(255,255,255,0.2);
    padding:15px;
    border-radius:15px;
    margin-top:10px;
    backdrop-filter:blur(10px);
}

</style>

</head>

<body class="sunny">

<canvas id="rain"></canvas>

<div class="ui">
<div class="clock" id="clock"></div>
<div id="temp"></div>
<div class="card">Humidity: <span id="hum"></span></div>
<div class="card">Wind: <span id="wind"></span></div>
<div class="card">UV: <span id="uv"></span></div>
</div>

<script>

// ===== CLOCK =====
setInterval(()=>{
let now=new Date();
document.getElementById("clock").innerText =
now.getHours()+":"+String(now.getMinutes()).padStart(2,'0');
},1000);

// ===== CANVAS =====
const canvas=document.getElementById("rain");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let rain=[];

for(let i=0;i<200;i++){
    rain.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        l:Math.random()*15
    });
}

function drawRain(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle="rgba(255,255,255,0.5)";

rain.forEach(p=>{
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(p.x,p.y+p.l);
    ctx.stroke();

    p.y+=10;
    if(p.y>canvas.height) p.y=0;
});

requestAnimationFrame(drawRain);
}
drawRain();

// ===== SOUND =====
let rainSound=new Audio("https://www.soundjay.com/nature/rain-01.mp3");
rainSound.loop=true;

let windSound=new Audio("https://www.soundjay.com/nature/wind-01.mp3");
windSound.loop=true;

// ===== LIGHTNING =====
function lightning(){
    document.body.style.filter="brightness(2)";
    setTimeout(()=>{
        document.body.style.filter="brightness(1)";
    },100);
}

// random lightning
setInterval(()=>{
    if(Math.random()>0.8){
        lightning();
    }
},3000);

// ===== WEATHER =====
async function getWeather(lat,lon){

let data=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,uv_index`
).then(r=>r.json());

let c=data.current;

document.getElementById("temp").innerText=
Math.round(c.temperature_2m)+"°C";

document.getElementById("hum").innerText=c.relative_humidity_2m+"%";
document.getElementById("wind").innerText=c.wind_speed_10m;
document.getElementById("uv").innerText=c.uv_index;

// WEATHER MODE
if(c.temperature_2m>30){
    document.body.className="sunny";
    rainSound.pause();
    windSound.pause();
}
else if(c.temperature_2m<25){
    document.body.className="rainy";
    rainSound.play();
    windSound.play();
}
else{
    document.body.className="cloudy";
    windSound.play();
}

}

// GPS
navigator.geolocation.getCurrentPosition(pos=>{
    getWeather(pos.coords.latitude,pos.coords.longitude);
});

// REGISTER SW
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
