<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SkyGlobe Weather</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
    margin:0;
    font-family: 'Segoe UI';
    background: linear-gradient(180deg,#a9d6ff,#ffffff);
    color:#222;
    overflow:hidden;
}

/* SEARCH */
.topbar{
    position:absolute;
    top:15px;
    width:100%;
    display:flex;
    justify-content:center;
    z-index:10;
}

input{
    padding:10px;
    border-radius:20px;
    border:none;
    width:200px;
}

button{
    margin-left:5px;
    padding:10px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

/* CLOCK */
.clock{
    position:absolute;
    top:80px;
    width:100%;
    text-align:center;
    font-size:55px;
    font-weight:600;
}

/* BOTTOM */
.bottom{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    z-index:10;
}

.temp{
    font-size:40px;
    font-weight:bold;
}

.forecast{
    margin-top:10px;
    display:flex;
    justify-content:center;
    gap:10px;
}

.card{
    background:white;
    padding:10px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

canvas{
    position:absolute;
    top:0;
    left:0;
}
</style>
</head>

<body>

<!-- SEARCH -->
<div class="topbar">
    <input id="search" placeholder="Cari kota...">
    <button onclick="searchCity()">🔍</button>
</div>

<!-- CLOCK -->
<div class="clock" id="clock"></div>

<!-- BOTTOM -->
<div class="bottom">
    <div class="temp" id="temp">--°C</div>
    <div id="city"></div>

    <div class="forecast">
        <div class="card">🌤️</div>
        <div class="card">🌧️</div>
        <div class="card">☁️</div>
    </div>
</div>

<script>

// ===== CLOCK =====
setInterval(()=>{
let now=new Date();
document.getElementById("clock").innerText =
now.getHours()+":"+String(now.getMinutes()).padStart(2,"0");
},1000);

// ===== THREE =====
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75, innerWidth/innerHeight, 0.1, 1000
);

camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({alpha:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ===== LIGHT =====
const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(5,3,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff,0.4);
scene.add(ambient);

// ===== TEXTURE =====
const loader = new THREE.TextureLoader();

const earthTexture = loader.load(
"https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
);

const nightTexture = loader.load(
"https://threejs.org/examples/textures/planets/earth_lights_2048.png"
);

const cloudTexture = loader.load(
"https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
);

// ===== EARTH (REALISTIC) =====
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1.3,128,128),
    new THREE.MeshStandardMaterial({
        map: earthTexture,
        emissive: new THREE.Color(0xffffff),
        emissiveMap: nightTexture,
        emissiveIntensity: 0.4
    })
);

scene.add(earth);

// ===== CLOUD =====
const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(1.32,128,128),
    new THREE.MeshStandardMaterial({
        map: cloudTexture,
        transparent:true,
        opacity:0.5
    })
);

scene.add(clouds);

// ===== ANIMATION =====
function animate(){
    requestAnimationFrame(animate);

    earth.rotation.y += 0.001;
    clouds.rotation.y += 0.0012;

    renderer.render(scene,camera);
}
animate();

// ===== WEATHER =====
async function searchCity(){

let name = document.getElementById("search").value;

let geo = await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${name}`
).then(r=>r.json());

let c = geo.results.find(x=>x.country_code==="ID") || geo.results[0];

document.getElementById("city").innerText =
c.name + ", " + c.country_code;

// WEATHER
let w = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m`
).then(r=>r.json());

document.getElementById("temp").innerText =
Math.round(w.current.temperature_2m)+"°C";

}

// AUTO GPS
navigator.geolocation.getCurrentPosition(pos=>{
    searchCity("Jakarta");
});

// SW
if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
