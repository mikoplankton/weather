<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SkyGlobe Weather</title>

<link rel="manifest" href="manifest.json">

<!-- ✅ THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
    margin:0;
    font-family:'Segoe UI';
    background:linear-gradient(#a9d6ff,#ffffff);
    color:#222;
    overflow:hidden;
}

/* SEARCH */
.top{
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
}

input{
    padding:10px;
    border-radius:20px;
    border:none;
    width:200px;
}

/* TOGGLE */
#toggle{
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    padding:10px;
    border-radius:50%;
    cursor:pointer;
}

/* CLOCK */
.clock{
    position:absolute;
    top:70px;
    width:100%;
    text-align:center;
    font-size:50px;
}

/* BOTTOM */
.bottom{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
}

/* CARD */
.card{
    background:white;
    margin:5px;
    padding:10px;
    border-radius:15px;
    display:inline-block;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.temp{
    font-size:40px;
    font-weight:bold;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}
</style>
</head>

<body>

<!-- LIGHT DARK -->
<div id="toggle">🌙</div>

<!-- SEARCH -->
<div class="top">
<input id="search" placeholder="Cari kota..." onkeydown="if(event.key==='Enter')searchCity()">
</div>

<!-- CLOCK -->
<div class="clock" id="clock"></div>

<!-- INFO -->
<div class="bottom">
<div class="temp" id="temp">--°C</div>
<div id="city"></div>

<div>
    <div class="card">💧 <span id="hum"></span>%</div>
    <div class="card">🌬️ <span id="wind"></span> km/h</div>
</div>

<div id="forecast"></div>
</div>

<script>

// ===== CLOCK =====
setInterval(()=>{
let n=new Date();
document.getElementById("clock").innerText =
n.getHours()+":"+String(n.getMinutes()).padStart(2,"0");
},1000);

// ===== THREE =====
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75, innerWidth/innerHeight, 0.1, 1000
);
camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({alpha:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(5,3,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff,0.4);
scene.add(ambient);

// TEXTURE
const loader = new THREE.TextureLoader();

const earthTexture = loader.load(
"https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
);

const night = loader.load(
"https://threejs.org/examples/textures/planets/earth_lights_2048.png"
);

const cloud = loader.load(
"https://threejs.org/examples/textures/planets/earth_clouds_1024.png"
);

// EARTH
const earth = new THREE.Mesh(
new THREE.SphereGeometry(1.3,128,128),
new THREE.MeshStandardMaterial({
    map:earthTexture,
    emissive:new THREE.Color(0xffffff),
    emissiveMap:night,
    emissiveIntensity:0.4
})
);
scene.add(earth);

// CLOUD
const clouds = new THREE.Mesh(
new THREE.SphereGeometry(1.32,128,128),
new THREE.MeshStandardMaterial({
    map:cloud,
    transparent:true,
    opacity:0.4
})
);
scene.add(clouds);

// ✅ SATELLITE
const satellite = new THREE.Mesh(
new THREE.SphereGeometry(0.05,16,16),
new THREE.MeshBasicMaterial({color:0xffcc00})
);
scene.add(satellite);

let satAngle = 0;

// ANIMATE
function animate(){
requestAnimationFrame(animate);

earth.rotation.y += 0.001;
clouds.rotation.y += 0.0012;

satAngle += 0.02;

satellite.position.set(
Math.cos(satAngle)*2,
Math.sin(satAngle)*0.5,
Math.sin(satAngle)*2
);

renderer.render(scene,camera);
}
animate();

// ===== WEATHER =====
async function searchCity(){

let name = document.getElementById("search").value;

let geo = await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${name}`
).then(r=>r.json());

let c = geo.results.find(x=>x.country_code==="ID") || geo.results[0];

document.getElementById("city").innerText =
c.name + ", " + c.country_code;

// WEATHER DATA
let w = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=temperature_2m`
).then(r=>r.json());

let cur = w.current;

document.getElementById("temp").innerText =
Math.round(cur.temperature_2m)+"°C";

document.getElementById("hum").innerText =
cur.relative_humidity_2m;

document.getElementById("wind").innerText =
cur.wind_speed_10m;

// FORECAST
let html="";
for(let i=0;i<5;i++){
let t = Math.round(w.hourly.temperature_2m[i]);
let icon = t>30?"☀️":t<25?"🌧️":"☁️";

html += `<div class="card">${icon}<br>${t}°</div>`;
}
document.getElementById("forecast").innerHTML = html;

}

// AUTO LOAD
navigator.geolocation.getCurrentPosition(()=>{
    searchCity("Jakarta");
});

// ===== LIGHT DARK =====
let dark=false;
document.getElementById("toggle").onclick=()=>{
dark=!dark;

if(dark){
document.body.style.background="black";
document.body.style.color="white";
document.getElementById("toggle").innerText="☀️";
}else{
document.body.style.background="linear-gradient(#a9d6ff,#ffffff)";
document.body.style.color="#222";
document.getElementById("toggle").innerText="🌙";
}
};

// SW
if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
