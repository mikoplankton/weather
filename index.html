<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Weather Final Boss</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
    color:white;
}

/* UI PANEL */
#ui {
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.4);
    padding:15px;
    border-radius:15px;
    backdrop-filter: blur(10px);
    z-index:10;
}

input,button{
    padding:8px;
    margin:3px;
    border:none;
    border-radius:8px;
}

/* SPLASH SCREEN */
#splash {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#splash img{
    width:120px;
    margin-bottom:15px;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
    <img src="icon-512.png">
    <h2>Weather 3D</h2>
</div>

<!-- UI -->
<div id="ui">
    <input id="search" value="Jakarta">
    <button onclick="searchCity()">Search</button>
    <button onclick="useGPS()">📍</button>

    <h2 id="temp">--</h2>
    <p id="city"></p>
</div>

<script>

// ====== SPLASH HIDE ======
window.addEventListener("load", ()=>{
    setTimeout(()=>{
        document.getElementById("splash").style.display="none";
    },1500);
});

// ====== THREE SETUP ======
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75, window.innerWidth/window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.z = 5;

// ====== LIGHT ======
const light = new THREE.PointLight(0xffffff,1.5,100);
light.position.set(0,2,5);
scene.add(light);

// ====== FOG ======
scene.fog = new THREE.Fog(0x000000,5,20);

// ====== SUN ======
const sun = new THREE.Mesh(
    new THREE.SphereGeometry(1,32,32),
    new THREE.MeshBasicMaterial({color:0xffcc00})
);
scene.add(sun);

// ====== RAIN ======
let rainGeo = new THREE.BufferGeometry();
let rainCount = 3000;

let rainArr = [];

for(let i=0;i<rainCount;i++){
    rainArr.push(
        (Math.random()*10)-5,
        Math.random()*10,
        (Math.random()*10)-5
    );
}

rainGeo.setAttribute('position',
    new THREE.Float32BufferAttribute(rainArr,3)
);

let rain = new THREE.Points(
    rainGeo,
    new THREE.PointsMaterial({color:0xaaaaaa,size:0.05})
);
scene.add(rain);

// ====== WIND ======
const wind = new THREE.Mesh(
    new THREE.TorusGeometry(2,0.05,16,100),
    new THREE.MeshBasicMaterial({color:0xffffff})
);
scene.add(wind);

// ====== SOUND ======
let rainSound = new Audio("https://www.soundjay.com/nature/rain-01.mp3");
rainSound.loop = true;

let windSound = new Audio("https://www.soundjay.com/nature/wind-01.mp3");
windSound.loop = true;

// ====== WEATHER CONTROL ======
function setWeather(t){

if(t>30){
    sun.visible=true;
    rain.visible=false;
    wind.visible=false;
    renderer.setClearColor(0x87ceeb);
    rainSound.pause();
    windSound.pause();
}
else if(t<25){
    sun.visible=false;
    rain.visible=true;
    wind.visible=true;
    renderer.setClearColor(0x2c3e50);
    rainSound.play();
    windSound.play();
}
else{
    sun.visible=false;
    rain.visible=false;
    wind.visible=true;
    renderer.setClearColor(0xbdc3c7);
    windSound.play();
}

}

// ====== LIGHTNING ======
function lightning(){
    light.intensity = 5;
    setTimeout(()=> light.intensity = 1.5, 100);
}

setInterval(()=>{
    if(Math.random()>0.8){
        lightning();
    }
},3000);

// ====== ANIMATION ======
function animate(){
requestAnimationFrame(animate);

sun.rotation.y += 0.01;
wind.rotation.x += 0.02;

let pos = rain.geometry.attributes.position;

for(let i=0;i<pos.count;i++){
    pos.array[i*3+1] -= 0.1;
    if(pos.array[i*3+1] < 0){
        pos.array[i*3+1] = 10;
    }
}

pos.needsUpdate = true;

renderer.render(scene,camera);

}
animate();

// ====== WEATHER API ======
async function getWeather(lat,lon,name){

let res = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`
);

let data = await res.json();

let t = data.current.temperature_2m;

document.getElementById("temp").innerText = t+"°C";
document.getElementById("city").innerText = name;

setWeather(t);
}

// ====== SEARCH ======
async function searchCity(){
let c = document.getElementById("search").value;

let geo = await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${c}`
).then(r=>r.json());

let city = geo.results[0];

getWeather(city.latitude, city.longitude, city.name);
}

// ====== GPS ======
function useGPS(){
navigator.geolocation.getCurrentPosition(pos=>{
    getWeather(
        pos.coords.latitude,
        pos.coords.longitude,
        "Lokasi Saya"
    );
});
}

// ====== INIT ======
useGPS();

// ====== SERVICE WORKER ======
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
