<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SkyGlobe App REAL</title>

https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(#4facfe,#00f2fe);
color:white;
overflow-x:hidden;
}

.app{
height:100vh;
overflow-y:auto;
padding-bottom:50px;
}

/* SEARCH */
.search{
position:fixed;
top:10px;
width:100%;
text-align:center;
z-index:10;
}

input{
padding:10px;
border-radius:20px;
border:none;
width:200px;
}

/* TOGGLE */
#toggle{
position:fixed;
top:10px;
right:10px;
background:white;
color:black;
padding:10px;
border-radius:50%;
cursor:pointer;
}

/* HEADER */
.header{
margin-top:80px;
text-align:center;
}

.temp{
font-size:70px;
}

/* CARD */
.card{
margin:15px;
padding:15px;
border-radius:20px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(20px);
}

/* HOURLY */
.hourly{
display:flex;
gap:10px;
overflow-x:auto;
}

.hour{
min-width:70px;
text-align:center;
}

/* DAILY */
.row{
display:flex;
justify-content:space-between;
}

/* GLOBE */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
opacity:0.2;
}
</style>
</head>

<body>

<div id="toggle">🌙</div>

<div class="search">
<input id="search" placeholder="Cari kota..."
onkeydown="if(event.key==='Enter')searchCity()">
</div>

<div class="app">

<div class="header">
<div id="city">Jakarta</div>
<div class="temp" id="temp">--°</div>
<div id="desc">--</div>
</div>

<div class="card" id="info"></div>

<div class="card">
<h3>Next 24 Hours</h3>
<div class="hourly" id="hourly"></div>
</div>

<div class="card">
<h3>Next 7 Days</h3>
<div id="daily"></div>
</div>

</div>

<script>

// ===== DARK MODE =====
let dark=false;
toggle.onclick=()=>{
dark=!dark;
document.body.style.background=
dark?"#111":"linear-gradient(#4facfe,#00f2fe)";
};

// ===== ICON =====
function icon(t){
if(t>30) return "☀️";
if(t<25) return "🌧️";
return "☁️";
}

// ===== SEARCH CITY =====
async function searchCity(){

let name=document.getElementById("search").value || "Jakarta";

// GEO
let geo=await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${name}`
).then(r=>r.json());

let c=geo.results ? geo.results[0] : null;

if(!c){
alert("Kota tidak ditemukan");
return;
}

// WEATHER
let w=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m,relative_humidity_2m&hourly=temperature_2m,time&daily=temperature_2m_max,temperature_2m_min`
).then(r=>r.json());

// HEADER
city.innerText=c.name;
temp.innerText=Math.round(w.current.temperature_2m)+"°";
desc.innerText="Live Weather";

// INFO
info.innerText="Humidity "+w.current.relative_humidity_2m+"%";

// HOURLY (REAL)
hourly.innerHTML="";
for(let i=0;i<8;i++){
let t=Math.round(w.hourly.temperature_2m[i]);
let hour=new Date(w.hourly.time[i]).getHours();
hourly.innerHTML+=`
<div class="hour">
${hour}:00<br>
${icon(t)}<br>
${t}°
</div>`;
}

// DAILY (REAL)
daily.innerHTML="";
for(let i=0;i<7;i++){
daily.innerHTML+=`
<div class="row">
<div>Day ${i+1}</div>
<div>
${Math.round(w.daily.temperature_2m_min[i])}° /
${Math.round(w.daily.temperature_2m_max[i])}°
</div>
</div>`;
}

}

// AUTO LOAD
searchCity();

// ===== GLOBE =====
const scene=new THREE.Scene();

const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
cam.position.z=4;

const rend=new THREE.WebGLRenderer({alpha:true});
rend.setSize(innerWidth,innerHeight);
document.body.appendChild(rend.domElement);

const earth=new THREE.Mesh(
new THREE.SphereGeometry(0.8,64,64),
new THREE.MeshStandardMaterial({
map:new THREE.TextureLoader().load(
"https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg")
})
);

scene.add(earth);
scene.add(new THREE.AmbientLight(0xffffff,1));

function animate(){
requestAnimationFrame(animate);
earth.rotation.y+=0.001;
rend.render(scene,cam);
}
animate();

</script>

</body>
</html>
